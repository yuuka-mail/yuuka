name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Same command an agent runs locally; CI adds nothing of its own.
      - run: mise run check

  # Builds the image so a broken Dockerfile fails CI. Nothing is pushed:
  # images are published only by release.yml, from a version tag.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: VERSION=0.0.0-ci+${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
