# yuuka behind Caddy, with Postgres and a scheduled pg_dump. See README.md.
#
# Two files next to this one hold the deployment's own values, both
# gitignored: .env (read by Compose for the ${...} below; template:
# compose.env.example) and yuuka.env (yuuka's configuration; template:
# yuuka.env.example).
#
# Only caddy publishes ports. yuuka and postgres share the internal
# "backend" network, which has no route outside; yuuka is also on "edge"
# so Caddy can reach it and it can reach R2 and Telegram.

name: yuuka

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80" # ACME HTTP-01 and the redirect to HTTPS; optional
      - "443:443"
      - "443:443/udp" # HTTP/3; optional
    environment:
      YUUKA_WEB_ORIGIN: ${YUUKA_WEB_ORIGIN:?set YUUKA_WEB_ORIGIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [yuuka]

  yuuka:
    <<: *hardening
    image: ${YUUKA_IMAGE:?set YUUKA_IMAGE in .env}
    # The image's default command is serve; `docker compose run --rm yuuka
    # admin enroll` and friends reuse this service's environment.
    read_only: true
    cap_drop: [ALL]
    env_file: [yuuka.env]
    # These follow from the shape of this file, so they are set here and
    # override anything in yuuka.env.
    environment:
      YUUKA_DATABASE_URL: postgres://yuuka:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/yuuka?sslmode=disable
      YUUKA_WEB_ORIGIN: ${YUUKA_WEB_ORIGIN}
      YUUKA_DATA_DIR: /var/lib/yuuka
      YUUKA_LISTEN: 0.0.0.0:31480
    volumes:
      - yuuka-data:/var/lib/yuuka
    networks: [edge, backend]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    <<: *hardening
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: yuuka
      POSTGRES_DB: yuuka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18 keeps PGDATA in a versioned directory below this, which
      # leaves room for pg_upgrade --link next to it.
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    shm_size: 256m
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yuuka", "-d", "yuuka"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # pg_dump on a timer; backup.sh says why it looks like this. Same image as
  # postgres, so pg_dump is never older than the server.
  backup:
    <<: *hardening
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    entrypoint: ["/bin/sh", "/usr/local/bin/yuuka-backup"]
    read_only: true
    cap_drop: [ALL]
    environment:
      PGHOST: postgres
      PGUSER: yuuka
      PGDATABASE: yuuka
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backup.sh:/usr/local/bin/yuuka-backup:ro
      - backups:/backups
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/yuuka-backup", "check"]
      interval: 10m
      start_period: 5m

networks:
  edge: {}
  backend:
    internal: true

volumes:
  postgres-data:
  yuuka-data:
  caddy-data:
  caddy-config:
  backups:
