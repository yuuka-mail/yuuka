# yuuka with Postgres and a scheduled pg_dump, behind Caddy. See README.md.
#
# Two files next to this one hold the deployment's own values, both
# gitignored: .env (read by Compose for the ${...} below, and for
# COMPOSE_PROFILES / COMPOSE_FILE; template: compose.env.example) and
# yuuka.env (yuuka's configuration; template: yuuka.env.example).
#
# Two ways to put a TLS proxy in front (README.md, "两种模式"):
#   - the bundled caddy service, in the "caddy" profile: it is the only
#     service publishing ports (80/443);
#   - a reverse proxy already running on the host: leave the profile off
#     and add compose.host-caddy.yaml, which publishes yuuka on the host's
#     loopback only.
#
# yuuka and postgres share the internal "backend" network, which has no
# route outside; yuuka is also on "edge" so a proxy can reach it and it can
# reach R2 and Telegram. The one-shot migrate service runs before yuuka,
# on "backend" only.

name: yuuka

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    <<: *hardening
    profiles: [caddy]
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80" # ACME HTTP-01 and the redirect to HTTPS; optional
      - "443:443"
      - "443:443/udp" # HTTP/3; optional
    environment:
      YUUKA_WEB_ORIGIN: ${YUUKA_WEB_ORIGIN:?set YUUKA_WEB_ORIGIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [yuuka]

  # Applies pending migrations as yuuka_owner and exits; yuuka starts only
  # once it has succeeded. It is the only yuuka process that holds the
  # owner's password, and it runs for seconds. `docker compose up -d` after
  # changing YUUKA_IMAGE thus migrates before the new serve starts; run it
  # by hand with `docker compose run --rm migrate`.
  migrate:
    <<: *hardening
    image: ${YUUKA_IMAGE:?set YUUKA_IMAGE in .env}
    command: ["migrate"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    # Only the owner's URL: no yuuka.env, no R2 keys, no webhook secrets.
    environment:
      YUUKA_DATABASE_OWNER_URL: postgres://yuuka_owner:${YUUKA_DB_OWNER_PASSWORD:?set YUUKA_DB_OWNER_PASSWORD in .env}@postgres:5432/yuuka?sslmode=disable
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  yuuka:
    <<: *hardening
    image: ${YUUKA_IMAGE:?set YUUKA_IMAGE in .env}
    # The image's default command is serve; `docker compose run --rm yuuka
    # admin enroll` and friends reuse this service's environment, and so
    # also connect as yuuka_app only.
    # No healthcheck: the image is distroless, with no shell or curl to
    # run one. The proxy checks GET /healthz instead (Caddyfile).
    read_only: true
    cap_drop: [ALL]
    # On stop, a send past its commit point waits for the server's final
    # reply (seconds); a kill before it turns into an unknown that a
    # person must resolve (§4.5).
    stop_grace_period: 1m
    env_file: [yuuka.env]
    # These follow from the shape of this file, so they are set here and
    # override anything in yuuka.env.
    environment:
      # Everything runs as yuuka_app, which cannot change the schema
      # (postgres-roles.sh). No YUUKA_DATABASE_OWNER_URL: the migrate
      # service above applies migrations, and serve only checks on start
      # that it finds the version it knows.
      YUUKA_DATABASE_URL: postgres://yuuka_app:${YUUKA_DB_APP_PASSWORD:?set YUUKA_DB_APP_PASSWORD in .env}@postgres:5432/yuuka?sslmode=disable
      # An empty value in yuuka.env would do no harm, a real one would
      # undo the point of the split; force it off either way.
      YUUKA_DATABASE_OWNER_URL: ""
      YUUKA_WEB_ORIGIN: ${YUUKA_WEB_ORIGIN}
      YUUKA_DATA_DIR: /var/lib/yuuka
      YUUKA_LISTEN: 0.0.0.0:31480
      # Whoever reaches yuuka over "edge" is a proxy: the bundled Caddy,
      # or a host process through the loopback port, which arrives from
      # the network's gateway. Their X-Forwarded-For names the client.
      YUUKA_TRUSTED_PROXIES: ${YUUKA_EDGE_SUBNET:-10.213.77.0/24},${YUUKA_EXTRA_TRUSTED_PROXIES:-}
    volumes:
      - yuuka-data:/var/lib/yuuka
    networks: [edge, backend]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  postgres:
    <<: *hardening
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      # The superuser, for initdb and maintenance only; no service
      # connects as it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: yuuka
      # Read by postgres-roles.sh.
      YUUKA_DB_OWNER_PASSWORD: ${YUUKA_DB_OWNER_PASSWORD}
      YUUKA_DB_APP_PASSWORD: ${YUUKA_DB_APP_PASSWORD}
      YUUKA_DB_BACKUP_PASSWORD: ${YUUKA_DB_BACKUP_PASSWORD:?set YUUKA_DB_BACKUP_PASSWORD in .env}
    volumes:
      # Postgres 18 keeps PGDATA in a versioned directory below this, which
      # leaves room for pg_upgrade --link next to it.
      - postgres-data:/var/lib/postgresql
      - ./postgres-roles.sh:/docker-entrypoint-initdb.d/10-yuuka-roles.sh:ro
    networks: [backend]
    shm_size: 256m
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "yuuka"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # pg_dump on a timer; backup.sh says why it looks like this. Same image as
  # postgres, so pg_dump is never older than the server.
  backup:
    <<: *hardening
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    entrypoint: ["/bin/sh", "/usr/local/bin/yuuka-backup"]
    read_only: true
    cap_drop: [ALL]
    environment:
      PGHOST: postgres
      # Read-only (postgres-roles.sh): this runs unattended on a timer.
      PGUSER: yuuka_backup
      PGDATABASE: yuuka
      PGPASSWORD: ${YUUKA_DB_BACKUP_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backup.sh:/usr/local/bin/yuuka-backup:ro
      - backups:/backups
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/yuuka-backup", "check"]
      interval: 10m
      start_period: 5m

networks:
  edge:
    # A fixed subnet so YUUKA_TRUSTED_PROXIES above can name it. Change
    # YUUKA_EDGE_SUBNET in .env if it collides with a network on the host.
    ipam:
      config:
        - subnet: ${YUUKA_EDGE_SUBNET:-10.213.77.0/24}
  backend:
    internal: true

volumes:
  postgres-data:
  yuuka-data:
  caddy-data:
  caddy-config:
  backups:
