# TypeScript types for the WebUI, generated by `go generate ./internal/api`.
# Paths are relative to this directory, where go generate runs tygo.
type_mappings:
  time.Time: string /* RFC 3339 */
packages:
  - path: github.com/yuuka-mail/yuuka/internal/api
    include_files: [types.go]
    output_path: ../../web/src/api/types.gen.ts
    preserve_comments: types
    enum_style: union
  - path: github.com/yuuka-mail/yuuka/internal/agentview
    include_files: [types.go]
    output_path: ../../web/src/api/agentview.gen.ts
    preserve_comments: types
    enum_style: union
  - path: github.com/yuuka-mail/yuuka/internal/authn
    include_files: [wire.go]
    output_path: ../../web/src/api/auth.gen.ts
    preserve_comments: types
