# Toolchain and tasks. A fresh clone needs only: mise install && mise run check
# Machine-local settings and secrets (e.g. a Cloudflare API token) go in
# mise.local.toml, which is gitignored.

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
pnpm = "12.14.0"
watchexec = "2.8.0"
# Node's version lives in .node-version, the file the Node ecosystem reads
# (fnm, editors, CI services); mise reads it too.

[settings]
idiomatic_version_file_enable_tools = ["node"]

[tasks.fmt]
description = "Format Go code in place"
run = "golangci-lint fmt"

[tasks.lint]
description = "Lint, vet and check formatting"
run = "golangci-lint run"

[tasks."db:up"]
description = "Start a throwaway Postgres for tests on 127.0.0.1:31432"
run = """
docker container inspect yuuka-test-pg >/dev/null 2>&1 || \
  docker run -d --rm --name yuuka-test-pg \
    -e POSTGRES_PASSWORD=yuuka -e POSTGRES_DB=yuuka_test \
    -p 127.0.0.1:31432:5432 postgres:18-alpine -c max_connections=300 >/dev/null
until docker exec yuuka-test-pg pg_isready -U postgres -q; do sleep 0.5; done
"""

[tasks."db:down"]
description = "Remove the test Postgres container"
run = "docker rm -f yuuka-test-pg >/dev/null 2>&1 || true"

[tasks.test]
description = "Run Go tests with the race detector against the test Postgres"
depends = ["db:up"]
env = { YUUKA_TEST_DATABASE_URL = "postgres://postgres:yuuka@127.0.0.1:31432/yuuka_test?sslmode=disable" }
run = "go test -race ./..."

[tasks."js:install"]
description = "Install the pnpm workspace (web/ and worker/) exactly as locked"
run = "pnpm install --frozen-lockfile"

[tasks."worker:check"]
description = "Type-check and test the Email Worker"
depends = ["js:install"]
dir = "worker"
run = "pnpm run check"

[tasks.generate]
description = "Regenerate generated code (the WebUI's TypeScript types from Go)"
run = "go generate ./..."

[tasks."web:check"]
description = "Regenerate API types, then type-check, lint and test the WebUI"
dir = "web"
depends = ["js:install"]
run = ["go generate ../internal/api", "pnpm run check"]

[tasks."web:build"]
description = "Build the WebUI into web/dist, which go:embed puts into the yuuka binary"
dir = "web"
depends = ["js:install"]
run = "pnpm run build"

# Local development. Open http://localhost:31473 (Vite with hot reload); it
# proxies /api and /auth to `dev:serve` on 31480. Passkeys are bound to that
# origin, so dev:serve's YUUKA_WEB_ORIGIN must stay http://localhost:31473.
# dev:serve reads the R2 settings from mise.local.toml. Everything it writes
# stays in the yuuka_dev database and the gitignored local/dev/.
#
#   mise watch dev:serve --restart   # Go: rebuild and restart on change
#   mise run dev:web                 # WebUI: Vite with HMR
#   mise run dev:enroll              # first time: one-time passkey link

[tasks."dev:db"]
description = "Create and seed the yuuka_dev database if missing, then bring its schema up to date"
depends = ["db:up"]
env = { YUUKA_DATABASE_URL = "postgres://postgres:yuuka@127.0.0.1:31432/yuuka_dev?sslmode=disable" }
run = """
if ! docker exec yuuka-test-pg psql -U postgres -qtAc "SELECT 1 FROM pg_database WHERE datname='yuuka_dev'" | grep -q 1; then
  docker exec yuuka-test-pg psql -U postgres -qc 'CREATE DATABASE yuuka_dev'
  go run ./internal/devseed/cmd -n 300 -data-dir local/dev/data
fi
# serve never migrates on its own (one DSN means no auto-migration), so
# every dev task that depends on this one starts from the current schema.
go run ./cmd/yuuka migrate
"""

[tasks."dev:reset"]
description = "Drop the yuuka_dev database and local/dev/data, then seed again"
depends = ["db:up"]
run = [
  "docker exec yuuka-test-pg psql -U postgres -qc 'DROP DATABASE IF EXISTS yuuka_dev WITH (FORCE)'",
  "rm -rf local/dev/data",
  "mise run dev:db",
]

[tasks."dev:serve"]
description = "yuuka serve on 127.0.0.1:31480 against yuuka_dev (use with mise watch … --restart)"
depends = ["dev:db"]
# sources is what `mise watch` watches. With sources alone, mise also skips
# the task while they are older than its last run, and a server's run ends
# only when it is stopped: a fresh watch would then start nothing. No
# outputs means never up to date.
sources = ["cmd/**/*.go", "internal/**/*.go", "go.mod", "go.sum"]
outputs = []
env = { YUUKA_DATABASE_URL = "postgres://postgres:yuuka@127.0.0.1:31432/yuuka_dev?sslmode=disable", YUUKA_DATA_DIR = "{{config_root}}/local/dev/data", YUUKA_LISTEN = "127.0.0.1:31480", YUUKA_WEB_ORIGIN = "http://localhost:31473", YUUKA_WEBHOOK_SECRETS = "dev-only-webhook-secret-never-use-in-production", YUUKA_RECONCILE_INTERVAL = "1h" }
run = "go run ./cmd/yuuka serve"

[tasks."dev:web"]
description = "Vite dev server with hot reload on http://localhost:31473, proxying /api and /auth to dev:serve"
dir = "web"
depends = ["js:install"]
env = { YUUKA_DEV_API = "http://127.0.0.1:31480" }
run = "pnpm run dev"

[tasks."dev:enroll"]
description = "Print a one-time passkey enrollment link (and recovery codes) for the dev WebUI"
depends = ["dev:db"]
env = { YUUKA_DATABASE_URL = "postgres://postgres:yuuka@127.0.0.1:31432/yuuka_dev?sslmode=disable", YUUKA_WEB_ORIGIN = "http://localhost:31473" }
run = "go run ./cmd/yuuka admin enroll --ttl 60m"

[tasks.check]
description = "Everything CI runs; must pass before a change is done"
depends = ["lint", "test", "worker:check", "web:check"]
