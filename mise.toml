# Toolchain and tasks. A fresh clone needs only: mise install && mise run check
# Machine-local settings and secrets (e.g. a Cloudflare API token) go in
# mise.local.toml, which is gitignored.

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
pnpm = "12.14.0"
# Node's version lives in .node-version, the file the Node ecosystem reads
# (fnm, editors, CI services); mise reads it too.

[settings]
idiomatic_version_file_enable_tools = ["node"]

[tasks.fmt]
description = "Format Go code in place"
run = "golangci-lint fmt"

[tasks.lint]
description = "Lint, vet and check formatting"
run = "golangci-lint run"

[tasks."db:up"]
description = "Start a throwaway Postgres for tests on 127.0.0.1:31432"
run = """
docker container inspect yuuka-test-pg >/dev/null 2>&1 || \
  docker run -d --rm --name yuuka-test-pg \
    -e POSTGRES_PASSWORD=yuuka -e POSTGRES_DB=yuuka_test \
    -p 127.0.0.1:31432:5432 postgres:18-alpine -c max_connections=300 >/dev/null
until docker exec yuuka-test-pg pg_isready -U postgres -q; do sleep 0.5; done
"""

[tasks."db:down"]
description = "Remove the test Postgres container"
run = "docker rm -f yuuka-test-pg >/dev/null 2>&1 || true"

[tasks.test]
description = "Run Go tests with the race detector against the test Postgres"
depends = ["db:up"]
env = { YUUKA_TEST_DATABASE_URL = "postgres://postgres:yuuka@127.0.0.1:31432/yuuka_test?sslmode=disable" }
run = "go test -race ./..."

[tasks."js:install"]
description = "Install the pnpm workspace (web/ and worker/) exactly as locked"
run = "pnpm install --frozen-lockfile"

[tasks."worker:check"]
description = "Type-check and test the Email Worker"
depends = ["js:install"]
dir = "worker"
run = "pnpm run check"

[tasks.generate]
description = "Regenerate generated code (the WebUI's TypeScript types from Go)"
run = "go generate ./..."

[tasks."web:check"]
description = "Regenerate API types, then type-check, lint and test the WebUI"
dir = "web"
depends = ["js:install"]
run = ["go generate ../internal/api", "pnpm run check"]

[tasks."web:build"]
description = "Build the WebUI into web/dist, which go:embed puts into the yuuka binary"
dir = "web"
depends = ["js:install"]
run = "pnpm run build"

[tasks."web:dev"]
description = "Vite dev server on http://localhost:31473 proxying /api and /auth to yuuka serve (YUUKA_DEV_API, default http://127.0.0.1:31480)"
dir = "web"
run = "pnpm run dev"

[tasks.check]
description = "Everything CI runs; must pass before a change is done"
depends = ["lint", "test", "worker:check", "web:check"]
